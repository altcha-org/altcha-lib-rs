[package]
name = "altcha"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["Daniel Regeci <536331+ovx@users.noreply.github.com>"]
description = "The official Rust implementation of the ALTCHA Proof-of-Work (v2) protocol."
license = "MIT"
readme = "README.md"
repository = "https://github.com/altcha-org/altcha-lib-rs"

[features]
argon2 = ["dep:argon2"]
scrypt = ["dep:scrypt"]
# Enables `wasm32-unknown-unknown` support for JS hosts (browsers, Node.js, Cloudflare
# Workers): clock via `Date.now()` and randomness via `crypto.getRandomValues()`.
# No effect on other targets.
js = ["dep:js-sys", "dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
digest = "0.10"
pbkdf2 = "0.12"
# Default features enable `password-hash`'s OS RNG (`getrandom` 0.2), which is unused here.
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc"] }
scrypt = { version = "0.11", optional = true, default-features = false }
rand = "0.10"
hex = "0.4"
subtle = "2"
thiserror = "2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
