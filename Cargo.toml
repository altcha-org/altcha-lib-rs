[package]
name = "altcha"
version = "0.2.0"
edition = "2021"
authors = ["Daniel Regeci <536331+ovx@users.noreply.github.com>"]
description = "The official Rust implementation of the ALTCHA Proof-of-Work (v2) protocol."
license = "MIT"
readme = "README.md"
repository = "https://github.com/altcha-org/altcha-lib-rs"

[features]
argon2 = ["dep:argon2"]
scrypt = ["dep:scrypt"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
digest = "0.10"
pbkdf2 = "0.12"
argon2 = { version = "0.5", optional = true }
scrypt = { version = "0.11", optional = true }
rand = "0.8"
hex = "0.4"
subtle = "2"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
